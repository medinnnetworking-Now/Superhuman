<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f0ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>COsense — Rescue & Safety Platform</title>

  <!-- Leaflet CSS & JS for OpenStreetMap Safe Zone View -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Standalone Local QR Code generator for wristband -->
  <script src="qrcode.bundle.js"></script>

  <!-- HTML5 QR Code Camera Scanner -->
  <script src="html5-qrcode.min.js"></script>

  <!-- App Custom Styles & Warm Tactile Theme -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Root SPA Container -->
  <div id="app-root">
    <!-- Initial Loading Shell -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;">
      <div style="font-weight: 800; letter-spacing: 0.18em; font-size: 20px; display: flex; align-items: center; margin-bottom: 8px;">
        <span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--green); margin-right: 8px;"></span>
        COSENSE
      </div>
      <div style="font-size: 13px; color: var(--muted);">Connecting to safety telemetry...</div>
    </div>
  </div>

  <!-- Main Application Script -->
  <script src="app.js"></script>

</body>
</html>
