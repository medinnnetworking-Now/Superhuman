<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemoryBand Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
      background: #f1f5f9;
      color: #0f172a;
    }
    .header {
      max-width: 650px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #16a34a;
      background: #dcfce7;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border-left: 5px solid #ef4444;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card h3 {
      color: #dc2626;
      font-size: 18px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      font-size: 14px;
      color: #475569;
      margin-bottom: 8px;
    }
    .card-time {
      font-size: 12px;
      color: #94a3b8;
    }
    .empty-state {
      background: white;
      text-align: center;
      padding: 40px 20px;
      border-radius: 12px;
      color: #64748b;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🛡️ MemoryBand Dashboard</h1>
    <div class="status-badge">
      <span class="status-dot"></span> Live ESP32 Feed
    </div>
  </div>

  <div class="container">
    <div id="events"></div>
  </div>

  <script>
    async function loadEvents() {
      try {
        const res = await fetch("/events");
        const data = await res.json();
        const div = document.getElementById("events");

        if (!data || data.length === 0) {
          div.innerHTML = `
            <div class="empty-state">
              <h3>No falls detected</h3>
              <p style="margin-top: 6px; font-size: 13px;">Waiting for real-time alerts from ESP32 sensor...</p>
            </div>
          `;
          return;
        }

        div.innerHTML = data.map(event => {
          const dateStr = new Date(event.timestamp).toLocaleString();
          return `
            <div class="card">
              <h3>🚨 Fall Detected</h3>
              <div class="card-meta">
                <div><strong>Device:</strong> ${event.device_id || "CS001"}</div>
                <div><strong>Battery:</strong> ${event.battery}%</div>
              </div>
              <div class="card-time">🕒 ${dateStr}</div>
            </div>
          `;
        }).join("");
      } catch (err) {
        console.error("Failed to load events:", err);
      }
    }

    loadEvents();
    setInterval(loadEvents, 2000);
  </script>

</body>
</html>
